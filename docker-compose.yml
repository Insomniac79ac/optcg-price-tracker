# worker and web will be added back once those services are implemented.

services:
  postgres:
    image: postgres:16
    container_name: opcg-postgres
    environment:
      POSTGRES_DB: opcg
      POSTGRES_USER: opcg
      POSTGRES_PASSWORD: opcg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: opcg-redis
    ports:
      - "6379:6379"

  api:
    build: ./services/api
    container_name: opcg-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://opcg:opcg@postgres:5432/opcg
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
