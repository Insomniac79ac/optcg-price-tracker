services:
  postgres:
    image: postgres:16
    container_name: opcg-postgres
    environment:
      POSTGRES_DB: opcg
      POSTGRES_USER: opcg
      POSTGRES_PASSWORD: opcg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: opcg-redis
    ports:
      - "6379:6379"

  api:
    build: ./services/api
    container_name: opcg-api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-dev-admin-token}
      DATABASE_URL: postgresql+psycopg://opcg:opcg@postgres:5432/opcg
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres
      - redis

  worker:
    build: ./services/worker
    container_name: opcg-worker
    command: celery -A worker.celery_app worker --loglevel=info
    environment:
      APP_ENV: ${APP_ENV:-development}
      SCRAPING_MODE: ${SCRAPING_MODE:-mock}
      DATABASE_URL: postgresql+psycopg://opcg:opcg@postgres:5432/opcg
      REDIS_URL: redis://redis:6379/0
      YUYUTEI_REQUEST_DELAY_MS: ${YUYUTEI_REQUEST_DELAY_MS:-3000}
      SNKRDUNK_REQUEST_DELAY_MS: ${SNKRDUNK_REQUEST_DELAY_MS:-3000}
      PRICE_REFRESH_INTERVAL_HOURS: ${PRICE_REFRESH_INTERVAL_HOURS:-6}
      PROJECT_ROOT: /app
      SNKRDUNK_SEED_FILE: /app/data/source_seeds/snkrdunk_one_piece_urls.txt
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - postgres
      - redis

  beat:
    build: ./services/worker
    container_name: opcg-beat
    command: celery -A worker.celery_app beat --loglevel=info
    environment:
      APP_ENV: ${APP_ENV:-development}
      SCRAPING_MODE: ${SCRAPING_MODE:-mock}
      DATABASE_URL: postgresql+psycopg://opcg:opcg@postgres:5432/opcg
      REDIS_URL: redis://redis:6379/0
      YUYUTEI_REQUEST_DELAY_MS: ${YUYUTEI_REQUEST_DELAY_MS:-3000}
      SNKRDUNK_REQUEST_DELAY_MS: ${SNKRDUNK_REQUEST_DELAY_MS:-3000}
      PRICE_REFRESH_INTERVAL_HOURS: ${PRICE_REFRESH_INTERVAL_HOURS:-6}
      PROJECT_ROOT: /app
      SNKRDUNK_SEED_FILE: /app/data/source_seeds/snkrdunk_one_piece_urls.txt
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - postgres
      - redis

  web:
    build: ./apps/web
    container_name: opcg-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api

volumes:
  postgres_data:
