[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "source-collector-kit"
version = "0.1.0"
description = "Shared fetch, etiquette, budget and RAW-first plumbing for Card Pirate's new shop collectors"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["source_collector_kit", "source_collector_kit.*"]
