[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "opcg-collection-services"
version = "0.1.0"
description = "Shared database models and opt-in collection services"
requires-python = ">=3.10"
dependencies = ["sqlalchemy>=2.0", "psycopg[binary]", "pydantic-settings", "opcg-source-identity"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.setuptools.package-data]
"app.services" = ["evidence/*.json"]
