name: ops-write
run-name: ops-write ${{ inputs.runbook }} apply=${{ inputs.apply }} ${{ inputs.scope }} ${{ inputs.request_id }}

# Owner-gated staging write runbooks. The first job waits in the `staging-ops` Environment for
# the owner's approval (required reviewer) and holds no credential; only then does the runbook
# job get the staging credentials of `staging-delivery`. Dry run by default. Quiet windows and
# "no staging delivery in progress" are checked at dispatch and again right before the runbook
# runs. Collector releases are not here: they stay on the CI delivery path (collector-redeploy
# only redeploys the verified image each collector already runs).
# docs/agent/OPS_RUNBOOKS.md
on:
  workflow_dispatch:
    inputs:
      runbook:
        description: Runbook
        type: choice
        required: true
        options:
          - enqueue-remaining-50
          - approve-f1-batch
          - enqueue-capture-batch
          - plan-refresh-backfill
          - apply-migration
          - collector-redeploy
          - collector-sibling-on
          - collector-sibling-off
          - catalogue-import
      apply:
        description: "Write (default: dry run, nothing written)"
        type: boolean
        default: false
      expected_sha256:
        description: "apply only: approved-list (apply-migration: SQL plan; collector-redeploy, catalogue-import: plan) SHA-256 from the dry run the owner reviewed"
        type: string
        default: ""
      count:
        description: "Batch size (empty: 50 for enqueue-remaining-50 and enqueue-capture-batch, 500 for approve-f1-batch and plan-refresh-backfill)"
        type: string
        default: ""
      revision:
        description: "apply-migration only: Alembic revision to apply (allowlisted)"
        type: string
        default: ""
      parent:
        description: "apply-migration only: the live revision it applies on"
        type: string
        default: ""
      scope:
        description: "catalogue-import only: scope name from docs/agent/CATALOGUE_IMPORT_SCOPES.json (e.g. eb-05)"
        type: string
        default: ""
      request_id:
        description: Free text shown in the run name, to find this run again
        type: string
        default: ""
  # workflow_dispatch reaches only a workflow GitHub has registered, and the default branch
  # (main) does not carry this file. A push to staging that changes it registers it; every
  # job is skipped on that push.
  push:
    branches: [staging]
    paths: [.github/workflows/ops-write.yml]

permissions:
  contents: read

concurrency:
  # The registration push gets its own group, so it never displaces a run waiting for approval.
  group: ops-write${{ github.event_name == 'push' && '-register' || '' }}
  cancel-in-progress: false

jobs:
  owner-approval:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'Insomniac79ac/optcg-price-tracker'
      && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Owner = required reviewer. No secrets are read in this job.
    environment: staging-ops
    permissions:
      contents: read
      actions: read
    env:
      RUNBOOK: ${{ inputs.runbook }}
      APPLY: ${{ inputs.apply }}
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      COUNT: ${{ inputs.count }}
      REVISION: ${{ inputs.revision }}
      PARENT: ${{ inputs.parent }}
      SCOPE: ${{ inputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check runbook, quiet windows and running deliveries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--preflight --workflow ops-write --expected-sha256 "$EXPECTED_SHA256")
          if [ -n "$REVISION" ]; then args+=(--revision "$REVISION"); fi
          if [ -n "$PARENT" ]; then args+=(--parent "$PARENT"); fi
          if [ -n "$SCOPE" ]; then args+=(--scope "$SCOPE"); fi
          if [ -n "$COUNT" ]; then args+=(--count "$COUNT"); fi
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          python scripts/ops/run.py "$RUNBOOK" "${args[@]}"

  runbook:
    needs: owner-approval
    runs-on: ubuntu-latest
    # approve-f1-batch approves one proposal per transaction, each a fresh resolver run.
    # collector-sibling-on/off re-uploads all 10 collectors in their slots (budgeted in
    # scripts/ops/collector_flag.py JOB_BUDGET_SECONDS); 360 is the hosted-runner maximum.
    timeout-minutes: 360
    environment: staging-delivery
    permissions:
      contents: read
      actions: read
    env:
      RUNBOOK: ${{ inputs.runbook }}
      APPLY: ${{ inputs.apply }}
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      COUNT: ${{ inputs.count }}
      REVISION: ${{ inputs.revision }}
      PARENT: ${{ inputs.parent }}
      SCOPE: ${{ inputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install tooling
        run: |
          pip install -q -r scripts/agent-state-requirements.txt -r services/api/requirements.txt
          pip install -q --no-deps ./packages/opcg_source_identity
          npm install -g @railway/cli@5.62.1
      - name: Run runbook (re-checks windows and deliveries first)
        env:
          GH_TOKEN: ${{ github.token }}
          RAILWAY_TOKEN: ${{ secrets.STAGING_RAILWAY_TOKEN }}
        run: |
          args=(--out ops-out --workflow ops-write --expected-sha256 "$EXPECTED_SHA256")
          if [ -n "$REVISION" ]; then args+=(--revision "$REVISION"); fi
          if [ -n "$PARENT" ]; then args+=(--parent "$PARENT"); fi
          if [ -n "$SCOPE" ]; then args+=(--scope "$SCOPE"); fi
          if [ -n "$COUNT" ]; then args+=(--count "$COUNT"); fi
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          python scripts/ops/run.py "$RUNBOOK" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ops-write-${{ inputs.runbook }}-${{ github.run_id }}
          path: ops-out
          retention-days: 90
          if-no-files-found: ignore
