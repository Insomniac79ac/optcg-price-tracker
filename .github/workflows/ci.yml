name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

# Test/build jobs are secret-free and use mock credentials. Staging delivery
# jobs use only the dedicated staging-delivery Environment secrets. See
# scripts/prod_verify.sh and docs/deployment.md for the mock compose checks.
jobs:
  staging-pr-live:
    # A push and ready_for_review in the same second (PR #123, 2026-10-14
    # 11:16:07Z) gave one run a stale head and the other a stale draft flag, so
    # neither armed. Decide from the live PR, before joining the delivery group.
    needs: policy-gate
    if: github.event_name == 'pull_request' && github.repository == 'Insomniac79ac/optcg-price-tracker' && github.base_ref == 'staging' && github.event.pull_request.head.repo.full_name == github.repository && vars.STAGING_AUTONOMY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      current: ${{ steps.live.outputs.current }}
    steps:
      - id: live
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/$REPO/pulls/$PR" \
            --jq '"current=\(.draft == false and .head.sha == env.HEAD)"' >> "$GITHUB_OUTPUT"

  staging-credential-presence:
    # An independent normal Environment job distinguishes unavailable staging
    # credentials from a reusable-workflow boundary without logging values.
    needs: [policy-gate, staging-pr-live]
    if: github.event_name == 'pull_request' && github.base_ref == 'staging' && github.event.pull_request.head.repo.full_name == github.repository && needs.staging-pr-live.outputs.current == 'true' && vars.STAGING_AUTONOMY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging-delivery
    concurrency:
      group: card-pirate-staging-delivery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check staging Environment secret presence without values
        env:
          STAGING_RAILWAY_TOKEN: ${{ secrets.STAGING_RAILWAY_TOKEN }}
          STAGING_VERCEL_READ_TOKEN: ${{ secrets.STAGING_VERCEL_READ_TOKEN }}
        run: |
          unavailable=0
          for name in STAGING_RAILWAY_TOKEN STAGING_VERCEL_READ_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Required staging environment secret unavailable: $name"
              unavailable=1
            else
              echo "Required staging environment secret present: $name"
            fi
          done
          test "$unavailable" = 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @railway/cli@5.62.1
      - name: Verify destination-pinned Railway read capabilities without values
        env:
          RAILWAY_TOKEN: ${{ secrets.STAGING_RAILWAY_TOKEN }}
        run: python scripts/probe_staging_credentials.py
      - name: Require a staging Postgres backup under 24 h for a product-lane migration
        if: needs.policy-gate.outputs.lane == 'product' && needs.policy-gate.outputs.migrations == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.STAGING_RAILWAY_TOKEN }}
        run: |
          pip install -q -r scripts/agent-state-requirements.txt
          python scripts/staging_backup_age.py --max-hours 24 --output docs/agent/evidence/latest-backup-age.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-credential-probe-${{ github.event.pull_request.head.sha }}
          path: |
            docs/agent/evidence/latest-staging-credential-probe.json
            docs/agent/evidence/latest-backup-age.json

  staging-automerge:
    # Resolve dedicated staging Environment secrets in this normal job.
    # Retain ownership from native arming through verification and state generation.
    needs: [policy-gate, staging-credential-presence, staging-pr-live]
    if: github.event_name == 'pull_request' && github.repository == 'Insomniac79ac/optcg-price-tracker' && github.base_ref == 'staging' && github.event.pull_request.head.repo.full_name == github.repository && needs.staging-pr-live.outputs.current == 'true' && vars.STAGING_AUTONOMY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Collectors roll out one at a time, each in its own safe slot (~10 x 3-16 min),
    # plus at most one hour held out of the 19:30-20:30 UTC merge window.
    timeout-minutes: 240
    environment: staging-delivery
    concurrency:
      group: card-pirate-staging-delivery
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Refuse missing safeguards before native auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          STAGING_RAILWAY_TOKEN: ${{ secrets.STAGING_RAILWAY_TOKEN }}
          STAGING_VERCEL_READ_TOKEN: ${{ secrets.STAGING_VERCEL_READ_TOKEN }}
        run: |
          for name in STAGING_RAILWAY_TOKEN STAGING_VERCEL_READ_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Required staging environment secret unavailable: $name"
              exit 1
            fi
          done
          gh api "repos/$REPO" --jq '.allow_auto_merge' | grep -qx true
          gh api "repos/$REPO/branches/staging" > /tmp/branch.json
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          python - <<'PY'
          import json, os
          b, p = (json.load(open('/tmp/' + n + '.json')) for n in ('branch', 'pr'))
          assert b['protected'], 'Staging must have enforced protection'
          assert 'engineering-gate' in b['protection']['required_status_checks']['contexts'], 'engineering-gate must be required'
          assert p['base']['ref'] == 'staging' and p['head']['repo']['full_name'] == os.environ['REPO']
          assert p['head']['sha'] == os.environ['HEAD'] and not p['draft']
          PY
          # Replay may verify and deliver only the exact native-merged current head.
          # Never attempt to arm a closed PR or deploy an obsolete merged commit.
          if [ "$(jq -r '.merged' /tmp/pr.json)" = true ]; then
            test "$(jq -r '.merge_commit_sha' /tmp/pr.json)" = "$(jq -r '.commit.sha' /tmp/branch.json)"
            test "$(jq -r '.merged_by.login' /tmp/pr.json)" = 'github-actions[bot]'
            echo 'Native merge already completed; exact current staging SHA verified.'
            exit 0
          fi
          # This mutation only enables native auto-merge. The CLI --auto
          # shortcut can instead merge immediately when a PR is already clean.
          node=$(jq -r '.node_id' /tmp/pr.json)
          gh api graphql -f query='mutation($pr:ID!,$head:GitObjectID!){enablePullRequestAutoMerge(input:{pullRequestId:$pr,expectedHeadOid:$head,mergeMethod:MERGE}){pullRequest{number headRefOid autoMergeRequest{enabledAt mergeMethod}}}}' \
            -f pr="$node" -f head="$HEAD" > /tmp/native-auto-merge.json
          python - <<'PY'
          import json, os
          p = json.load(open('/tmp/native-auto-merge.json'))['data']['enablePullRequestAutoMerge']['pullRequest']
          assert p['headRefOid'] == os.environ['HEAD']
          assert p['autoMergeRequest'] and p['autoMergeRequest']['mergeMethod'] == 'MERGE'
          print(json.dumps({'native_auto_merge_armed': True, 'head': p['headRefOid'],
                            'enabled_at': p['autoMergeRequest']['enabledAt'], 'method': 'MERGE'}))
          PY
      - name: Wait for native merge while owning staging
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # 30-minute merge budget (formerly 120 polls x 15 s), extended only by
          # time spent held out of the market-index window below.
          deadline=$(( $(date -u +%s) + 1800 ))
          while [ "$(date -u +%s)" -lt "$deadline" ]; do
            # A transient API error (PR #97: HTTP 504 at 11:42:38Z) is one failed
            # poll, not a failed delivery: native auto-merge stays armed and would
            # land the merge with no rollout. Retry within the same bounded budget;
            # every successful read is still checked as before.
            if ! gh api "repos/$REPO/pulls/$PR" > /tmp/merged.json || ! jq -e .number /tmp/merged.json > /dev/null; then
              echo "::warning::PR read failed; retrying"
              sleep 15
              continue
            fi
            test "$(jq -r '.head.sha' /tmp/merged.json)" = "$HEAD"
            merged=$(jq -r '.merged' /tmp/merged.json)
            if [ "$merged" = true ]; then
              echo "sha=$(jq -r '.merge_commit_sha' /tmp/merged.json)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            test "$(jq -r '.state' /tmp/merged.json)" = open
            # Never merge 19:30-20:30 UTC (market-index-snapshot runs at 20:00):
            # disarm, wait for the window to close, re-arm the same head.
            now=$(date -u +%s); day=$(date -u +%F)
            start=$(date -u -d "$day 19:30" +%s); end=$(date -u -d "$day 20:30" +%s)
            if [ "$now" -ge "$start" ] && [ "$now" -lt "$end" ]; then
              echo "::notice::19:30-20:30 UTC window: auto-merge disarmed until 20:30 UTC"
              gh pr merge "$PR" --repo "$REPO" --disable-auto
              sleep $((end - now))
              node=$(jq -r '.node_id' /tmp/merged.json)
              gh api graphql -f query='mutation($pr:ID!,$head:GitObjectID!){enablePullRequestAutoMerge(input:{pullRequestId:$pr,expectedHeadOid:$head,mergeMethod:MERGE}){pullRequest{number}}}' \
                -f pr="$node" -f head="$HEAD" > /dev/null
              deadline=$((deadline + end - now))
              continue
            fi
            sleep 15
          done
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.merge.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          pip install -r scripts/agent-state-requirements.txt playwright==1.58.0
          python -m playwright install --with-deps chromium
          npm install -g @railway/cli@5.62.1 vercel@60.1.3
      - name: Decide documentation-only or product-lane delivery scope
        id: scope
        env:
          MERGED_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          # Local Git only. Fails closed to the full delivery on any doubt.
          python scripts/staging_delivery_scope.py --merge "$MERGED_SHA" --output docs/agent/evidence/latest-delivery-scope.json || true
          decision=$(jq -r '.decision // "full"' docs/agent/evidence/latest-delivery-scope.json 2>/dev/null || echo full)
          if [ "$decision" != skip ] && [ "$decision" != product ]; then decision=full; fi
          # Every DATA-lane PR changes the manifest. A full delivery with an
          # unchanged manifest would replay an earlier mission's rollout/DDL.
          if [ "$decision" = full ] && git diff --quiet "$MERGED_SHA^1" "$MERGED_SHA" -- docs/agent/STAGING_MISSION.json; then
            echo "::error::Manifest unchanged but not a documentation or PRODUCT-lane merge; refusing rollout and DDL"
            exit 1
          fi
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
      - name: Apply reviewed additive RAW dependency migration
        if: steps.scope.outputs.decision == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
          RAILWAY_TOKEN: ${{ secrets.STAGING_RAILWAY_TOKEN }}
          STAGING_VERCEL_READ_TOKEN: ${{ secrets.STAGING_VERCEL_READ_TOKEN }}
          MERGED_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          pip install -r scripts/staging-migration-requirements.txt
          python scripts/apply_staging_raw_dependency.py --manifest docs/agent/STAGING_MISSION.json --expected "$MERGED_SHA" --output docs/agent/evidence/latest-raw-dependency-migration.json
      - name: Deploy mission-scoped staging collectors
        if: steps.scope.outputs.decision == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
          RAILWAY_TOKEN: ${{ secrets.STAGING_RAILWAY_TOKEN }}
          MERGED_SHA: ${{ steps.merge.outputs.sha }}
        run: python scripts/deploy_staging_collectors.py --manifest docs/agent/STAGING_MISSION.json --expected "$MERGED_SHA" --output docs/agent/evidence/latest-collector-rollout.json
      - name: Verify native Git deployment and regenerate state
        env:
          GH_TOKEN: ${{ github.token }}
          RAILWAY_TOKEN: ${{ secrets.STAGING_RAILWAY_TOKEN }}
          STAGING_VERCEL_READ_TOKEN: ${{ secrets.STAGING_VERCEL_READ_TOKEN }}
          EXPECTED: ${{ steps.merge.outputs.sha }}
        run: |
          # Dedicated staging environment only. API expectations are mission data.
          python - <<'PY'
          import json, os, subprocess
          m = json.load(open('docs/agent/STAGING_MISSION.json'))
          v = dict(m['deployment_verification'])
          scope = json.load(open('docs/agent/evidence/latest-delivery-scope.json'))
          if scope.get('decision') == 'product':
              # PRODUCT lane: the manifest is an earlier mission's; expect the
              # merged API and the repository's single Alembic head instead.
              v.update(api_sha=scope['api_sha'], revision=scope['revision'])
          extra = [arg for check in v.get('checks', []) for arg in ('--check', check)]
          subprocess.run(['python', 'scripts/verify_staging_delivery.py', '--expected', os.environ['EXPECTED'],
                          '--api-sha', v['api_sha'], '--revision', v['revision'],
                          '--output', 'docs/agent/evidence/latest-staging-delivery.json',
                          '--scope', 'docs/agent/evidence/latest-delivery-scope.json', *extra], check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-delivery-${{ steps.merge.outputs.sha }}
          path: |
            docs/agent/CURRENT_STATE.yaml
            docs/agent/evidence/latest-staging-delivery.json
            docs/agent/evidence/latest-collector-rollout.json
            docs/agent/evidence/latest-raw-dependency-migration.json
            docs/agent/evidence/latest-delivery-scope.json
            docs/agent/evidence/staging-state-*.json
      - name: Disarm an unmerged request if delivery stops
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$(gh api "repos/$REPO/pulls/$PR" --jq '.merged')" = false ]; then
            gh pr merge "$PR" --repo "$REPO" --disable-auto
          fi

  policy-gate:
    if: github.event_name == 'pull_request' && github.base_ref == 'staging'
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.policy.outputs.lane }}
      migrations: ${{ steps.policy.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate lane and mission against exact PR diff
        id: policy
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Candidate code is secret-free. Run the base policy and the base
          # product-lane classifier (with the base import-graph tooling) so a PR
          # cannot relax the evaluator used to assess itself.
          git worktree add --detach /tmp/base "$BASE"
          pip install -q -r /tmp/base/scripts/agent-state-requirements.txt
          git show "$HEAD:docs/agent/STAGING_MISSION.json" > /tmp/mission.json
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          body_arg=()
          # Bootstrap: a base policy without lanes evaluates the mission only.
          if grep -q -- '--pr-body-file' /tmp/base/scripts/staging_policy.py; then
            body_arg=(--pr-body-file /tmp/pr-body.txt)
          fi
          status=0
          python /tmp/base/scripts/staging_policy.py --base "$BASE" --head "$HEAD" --manifest /tmp/mission.json \
            "${body_arg[@]}" --output /tmp/policy.json || status=$?
          if [ -f /tmp/policy.json ]; then
            echo "lane=$(jq -r 'if .classification == "PRODUCT" then "product" else "data" end' /tmp/policy.json)" >> "$GITHUB_OUTPUT"
            echo "migrations=$(jq -r '(.lane.migrations // []) | length > 0' /tmp/policy.json)" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

  engineering-gate:
    if: always()
    needs: [policy-gate, agent-state-tests, check-secrets, prod-compose, release-check, backend-tests, worker-tests, collector-tests, railway-python-images, frontend-build, deploy-scripts-sanity]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          STAGING_PR: ${{ github.event_name == 'pull_request' && github.base_ref == 'staging' }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failures = [name for name, result in results.items()
                      if result['result'] != 'success'
                      and not (name == 'policy-gate' and os.environ['STAGING_PR'] == 'false'
                               and result['result'] == 'skipped')]
          if failures:
              raise SystemExit('Required checks failed or were skipped: ' + ', '.join(failures))
          PY

  agent-state-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/agent-state-requirements.txt
      - run: python -m unittest discover -s scripts/tests -p test_generate_staging_state.py -v
      - run: python -m unittest discover -s scripts/tests -p test_staging_policy.py -v
      - run: python -m unittest discover -s scripts/tests -p test_verify_staging_delivery.py -v
      - run: python -m unittest discover -s scripts/tests -p test_staging_delivery_scope.py -v
      - run: python -m unittest discover -s scripts/tests -p test_product_lane.py -v
      - run: python -m unittest discover -s scripts/tests -p test_collector_variables.py -v
      - run: python -m unittest discover -s scripts/tests -p test_operational_health.py -v
      - run: python -m unittest discover -s scripts/tests -p test_probe_staging_credentials.py -v
      - run: python -m unittest discover -s scripts/tests -p test_apply_staging_raw_dependency.py -v
      - run: python -m unittest discover -s scripts/tests -p test_collector_runtime_inputs.py -v
      - run: python -m unittest discover -s scripts/tests -p test_snkr_discovery_component.py -v
      - run: python -m unittest discover -s scripts/tests -p test_yuyu_raw_reader_component.py -v
      # pytest-style tests: the sequential collector rollout and the recovery scan.
      - run: pip install pytest==8.4.2 && python -m pytest -q scripts/tests/test_deploy_staging_collectors.py scripts/tests/test_collector_variables.py

  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if git is tracking a real env file
        run: bash scripts/check_secrets.sh

  prod-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose.prod.yml config + build (no real secrets, dummy placeholders only)
        run: ./scripts/prod_verify.sh
        env:
          # Backend/worker test suites already run in their own jobs below -
          # skip the (slower) duplicate run inside prod_verify.sh here.
          RUN_TESTS: "false"

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scripts/release_check.sh (no real secrets, dummy placeholders only)
        run: ./scripts/release_check.sh
        env:
          # Backend/worker test suites already run in their own jobs below -
          # skip the (slower) duplicate run inside release_check.sh here.
          RUN_TESTS: "false"

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: opcg
          POSTGRES_PASSWORD: opcg
          POSTGRES_DB: opcg_test
        ports: ["5544:5432"]
        options: >-
          --health-cmd "pg_isready -U opcg -d opcg_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://opcg:opcg@localhost:5544/opcg_test
      # A missing database fails instead of silently skipping (tests/pg_url.py).
      REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PostgreSQL end-to-end API tests invoke the worker subprocess too.
      - run: pip install -r services/api/requirements.txt -r services/worker/requirements.txt -r services/snkrdunk_collector/requirements.txt -r services/yuyutei_collector/requirements.txt
      - run: python -m pip install --no-deps ./packages/opcg_source_identity
      - run: cd services/api && python -m pytest -q

  worker-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: opcg
          POSTGRES_PASSWORD: opcg
          POSTGRES_DB: opcg_test
        ports: ["5544:5432"]
        options: >-
          --health-cmd "pg_isready -U opcg -d opcg_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://opcg:opcg@localhost:5544/opcg_test
      REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/worker/requirements.txt
      - run: python -m pip install --no-deps ./packages/opcg_source_identity
      - run: cd services/worker && python -m pytest -q

  collector-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collector: [snkrdunk_collector, yuyutei_collector]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opcg
          POSTGRES_PASSWORD: opcg
          POSTGRES_DB: opcg_test
        ports: ["5544:5432"]
        options: >-
          --health-cmd "pg_isready -U opcg -d opcg_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SNKRDUNK_TEST_PG_URL: postgresql+psycopg://opcg:opcg@localhost:5544/opcg_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/${{ matrix.collector }}/requirements.txt
      - run: pip install -r scripts/staging-migration-requirements.txt
      - run: python -m pip install ./packages/opcg_source_identity ./services/api
      - run: cd services/${{ matrix.collector }} && python -m pytest -q

  railway-python-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker, beat, snkrdunk-collector, yuyutei-collector]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/railway/${{ matrix.service }}.Dockerfile -t identity-${{ matrix.service }} .

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: cd apps/web && npm ci
      # Next16.2.10 Turbopack's Fraunces resolver failed in staging CI. Use
      # Next's supported compiler path here; retain all build/type/UI tests.
      - run: cd apps/web && npm run build -- ${{ github.base_ref == 'staging' && '--webpack' || '' }}
      - run: cd apps/web && npm test -- --maxWorkers=2
      - name: check-env.js unit tests
        run: cd apps/web && node --test scripts/*.test.js

  deploy-scripts-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: prod_smoke_test.sh, prod_verify.sh, release_check.sh, and final_audit.sh exist and are executable
        run: |
          test -x scripts/prod_smoke_test.sh
          test -x scripts/prod_verify.sh
          test -x scripts/release_check.sh
          test -x scripts/final_audit.sh
      - name: docs/route_inventory.md exists
        run: test -f docs/route_inventory.md
      - name: Makefile prod-*/release-check targets exist
        run: |
          for target in prod-build prod-up prod-down prod-logs prod-migrate prod-smoke prod-verify prod-backup release-check; do
            grep -qE "^${target}:" Makefile || { echo "missing Makefile target: $target"; exit 1; }
          done
      - name: Reverse proxy example configs and private compose override exist
        run: |
          test -f deploy/nginx/opcg.conf.example
          test -f deploy/caddy/Caddyfile.example
          test -f docker-compose.prod.private.yml
          test -f apps/web/src/app/api/backend-health/route.ts
      - name: prod_smoke_test.sh skips direct API checks when API_URL is unset
        run: |
          # No real web app running - just confirms the skip message/branch
          # fires correctly with API_URL unset, independent of whether the
          # (unreachable) WEB_BASE_URL checks themselves pass or fail.
          output="$(ADMIN_TOKEN=x WEB_BASE_URL=http://127.0.0.1:1 scripts/prod_smoke_test.sh || true)"
          echo "$output" | grep -qF "Skipping direct API checks because API_URL is not set." \
            || { echo "expected skip message not found"; echo "$output"; exit 1; }
      - name: prod_smoke_test.sh BASE_URL backward-compat alias still works
        run: |
          output="$(ADMIN_TOKEN=x BASE_URL=http://127.0.0.1:1 scripts/prod_smoke_test.sh || true)"
          echo "$output" | grep -qF "WEB_BASE_URL=http://127.0.0.1:1" \
            || { echo "BASE_URL was not picked up as WEB_BASE_URL"; echo "$output"; exit 1; }
      - name: prod_smoke_test.sh skips admin checks when ADMIN_TOKEN is unset but API_URL is set
        run: |
          output="$(API_URL=http://127.0.0.1:1 WEB_BASE_URL=http://127.0.0.1:1 scripts/prod_smoke_test.sh || true)"
          echo "$output" | grep -qF "Skipping (ADMIN_TOKEN not set)." \
            || { echo "expected admin-check skip message not found"; echo "$output"; exit 1; }
