name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

# All jobs below are secret-free by design - they check structure/config/
# build success, never a real .env.production or real ADMIN_TOKEN/DATABASE_URL/
# etc. See scripts/prod_verify.sh (the local equivalent of the prod-compose
# job) and docs/deployment.md.
jobs:
  staging-credential-presence:
    # An independent normal Environment job distinguishes unavailable staging
    # credentials from a reusable-workflow boundary without logging values.
    needs: policy-gate
    if: github.event_name == 'pull_request' && github.base_ref == 'staging' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft && vars.STAGING_AUTONOMY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging-delivery
    concurrency:
      group: card-pirate-staging-delivery
      cancel-in-progress: false
    steps:
      - name: Check staging Environment secret presence without values
        env:
          STAGING_RAILWAY_TOKEN: ${{ secrets.STAGING_RAILWAY_TOKEN }}
          STAGING_VERCEL_READ_TOKEN: ${{ secrets.STAGING_VERCEL_READ_TOKEN }}
        run: |
          unavailable=0
          for name in STAGING_RAILWAY_TOKEN STAGING_VERCEL_READ_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Required staging environment secret unavailable: $name"
              unavailable=1
            else
              echo "Required staging environment secret present: $name"
            fi
          done
          test "$unavailable" = 0

  staging-automerge:
    # Arm while the protected engineering-gate is pending. GitHub owns the
    # final merge decision; the delivery job retains its concurrency lease.
    needs: [policy-gate, staging-credential-presence]
    if: github.event_name == 'pull_request' && github.base_ref == 'staging' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft && vars.STAGING_AUTONOMY_ENABLED == 'true'
    uses: ./.github/workflows/staging-delivery.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      pr: ${{ format('{0}', github.event.pull_request.number) }}
      head: ${{ github.event.pull_request.head.sha }}

  policy-gate:
    if: github.event_name == 'pull_request' && github.base_ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate mission against exact PR diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Candidate code is secret-free. After bootstrap, run the base policy
          # so a PR cannot relax the evaluator used to assess itself.
          if git cat-file -e "$BASE:scripts/staging_policy.py" 2>/dev/null; then
            git show "$BASE:scripts/staging_policy.py" > /tmp/staging_policy.py
          else
            cp scripts/staging_policy.py /tmp/staging_policy.py
          fi
          git show "$HEAD:docs/agent/STAGING_MISSION.json" > /tmp/mission.json
          python /tmp/staging_policy.py --base "$BASE" --head "$HEAD" --manifest /tmp/mission.json

  engineering-gate:
    if: always()
    needs: [policy-gate, agent-state-tests, check-secrets, prod-compose, release-check, backend-tests, worker-tests, collector-tests, railway-python-images, frontend-build, deploy-scripts-sanity]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          STAGING_PR: ${{ github.event_name == 'pull_request' && github.base_ref == 'staging' }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failures = [name for name, result in results.items()
                      if result['result'] != 'success'
                      and not (name == 'policy-gate' and os.environ['STAGING_PR'] == 'false'
                               and result['result'] == 'skipped')]
          if failures:
              raise SystemExit('Required checks failed or were skipped: ' + ', '.join(failures))
          PY

  agent-state-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/agent-state-requirements.txt
      - run: python -m unittest discover -s scripts/tests -p test_generate_staging_state.py -v
      - run: python -m unittest discover -s scripts/tests -p test_staging_policy.py -v
      - run: python -m unittest discover -s scripts/tests -p test_verify_staging_delivery.py -v

  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if git is tracking a real env file
        run: bash scripts/check_secrets.sh

  prod-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose.prod.yml config + build (no real secrets, dummy placeholders only)
        run: ./scripts/prod_verify.sh
        env:
          # Backend/worker test suites already run in their own jobs below -
          # skip the (slower) duplicate run inside prod_verify.sh here.
          RUN_TESTS: "false"

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scripts/release_check.sh (no real secrets, dummy placeholders only)
        run: ./scripts/release_check.sh
        env:
          # Backend/worker test suites already run in their own jobs below -
          # skip the (slower) duplicate run inside release_check.sh here.
          RUN_TESTS: "false"

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: opcg
          POSTGRES_PASSWORD: opcg
          POSTGRES_DB: opcg_test
        ports: ["5544:5432"]
        options: >-
          --health-cmd "pg_isready -U opcg -d opcg_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://opcg:opcg@localhost:5544/opcg_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PostgreSQL end-to-end API tests invoke the worker subprocess too.
      - run: pip install -r services/api/requirements.txt -r services/worker/requirements.txt -r services/snkrdunk_collector/requirements.txt -r services/yuyutei_collector/requirements.txt
      - run: python -m pip install --no-deps ./packages/opcg_source_identity
      - run: cd services/api && python -m pytest -q

  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/worker/requirements.txt
      - run: python -m pip install --no-deps ./packages/opcg_source_identity
      - run: cd services/worker && python -m pytest -q

  collector-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collector: [snkrdunk_collector, yuyutei_collector]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opcg
          POSTGRES_PASSWORD: opcg
          POSTGRES_DB: opcg_test
        ports: ["5544:5432"]
        options: >-
          --health-cmd "pg_isready -U opcg -d opcg_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SNKRDUNK_TEST_PG_URL: postgresql+psycopg://opcg:opcg@localhost:5544/opcg_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/${{ matrix.collector }}/requirements.txt
      - run: python -m pip install ./packages/opcg_source_identity ./services/api
      - run: cd services/${{ matrix.collector }} && python -m pytest -q

  railway-python-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker, beat, snkrdunk-collector, yuyutei-collector]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/railway/${{ matrix.service }}.Dockerfile -t identity-${{ matrix.service }} .

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: cd apps/web && npm ci
      - run: cd apps/web && npm run build
      - run: cd apps/web && npm test -- --maxWorkers=2
      - name: check-env.js unit tests
        run: cd apps/web && node --test scripts/*.test.js

  deploy-scripts-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: prod_smoke_test.sh, prod_verify.sh, release_check.sh, and final_audit.sh exist and are executable
        run: |
          test -x scripts/prod_smoke_test.sh
          test -x scripts/prod_verify.sh
          test -x scripts/release_check.sh
          test -x scripts/final_audit.sh
      - name: docs/route_inventory.md exists
        run: test -f docs/route_inventory.md
      - name: Makefile prod-*/release-check targets exist
        run: |
          for target in prod-build prod-up prod-down prod-logs prod-migrate prod-smoke prod-verify prod-backup release-check; do
            grep -qE "^${target}:" Makefile || { echo "missing Makefile target: $target"; exit 1; }
          done
      - name: Reverse proxy example configs and private compose override exist
        run: |
          test -f deploy/nginx/opcg.conf.example
          test -f deploy/caddy/Caddyfile.example
          test -f docker-compose.prod.private.yml
          test -f apps/web/src/app/api/backend-health/route.ts
      - name: prod_smoke_test.sh skips direct API checks when API_URL is unset
        run: |
          # No real web app running - just confirms the skip message/branch
          # fires correctly with API_URL unset, independent of whether the
          # (unreachable) WEB_BASE_URL checks themselves pass or fail.
          output="$(ADMIN_TOKEN=x WEB_BASE_URL=http://127.0.0.1:1 scripts/prod_smoke_test.sh || true)"
          echo "$output" | grep -qF "Skipping direct API checks because API_URL is not set." \
            || { echo "expected skip message not found"; echo "$output"; exit 1; }
      - name: prod_smoke_test.sh BASE_URL backward-compat alias still works
        run: |
          output="$(ADMIN_TOKEN=x BASE_URL=http://127.0.0.1:1 scripts/prod_smoke_test.sh || true)"
          echo "$output" | grep -qF "WEB_BASE_URL=http://127.0.0.1:1" \
            || { echo "BASE_URL was not picked up as WEB_BASE_URL"; echo "$output"; exit 1; }
      - name: prod_smoke_test.sh skips admin checks when ADMIN_TOKEN is unset but API_URL is set
        run: |
          output="$(API_URL=http://127.0.0.1:1 WEB_BASE_URL=http://127.0.0.1:1 scripts/prod_smoke_test.sh || true)"
          echo "$output" | grep -qF "Skipping (ADMIN_TOKEN not set)." \
            || { echo "expected admin-check skip message not found"; echo "$output"; exit 1; }
