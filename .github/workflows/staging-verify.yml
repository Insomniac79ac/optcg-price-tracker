name: Verify staging merge

on:
  push:
    branches: [staging]
  # Re-verify a merge whose verification failed on deploy lag. Dispatch from
  # staging; expected_sha must still be the staging head, else the run exits
  # as obsolete.
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full 40-hex staging commit to re-verify (must be the current staging head)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: card-pirate-staging-delivery
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'Insomniac79ac/optcg-price-tracker' && vars.STAGING_AUTONOMY_ENABLED == 'true'
      && (github.event_name == 'push' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    # Platform wait (900 s) plus the frontend runtime SHA wait (600 s) plus the checks.
    timeout-minutes: 45
    environment: staging-delivery
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          pip install -r scripts/agent-state-requirements.txt playwright==1.58.0
          python -m playwright install --with-deps chromium
          npm install -g @railway/cli@5.62.1 vercel@60.1.3
      - name: Verify current staging head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          RAILWAY_TOKEN: ${{ secrets.STAGING_RAILWAY_TOKEN }}
          STAGING_VERCEL_READ_TOKEN: ${{ secrets.STAGING_VERCEL_READ_TOKEN }}
          EXPECTED: ${{ inputs.expected_sha || github.sha }}
        run: |
          test -n "$RAILWAY_TOKEN"
          test -n "$STAGING_VERCEL_READ_TOKEN"
          # Push: this merge. Dispatch: expected_sha, only while it is the staging head.
          python scripts/staging_verify_head.py --expected "$EXPECTED"
          if ! grep -qx 'current=true' "$GITHUB_OUTPUT"; then exit 0; fi
          # Fleet state plus the merge's own mission, if it added one. A changed,
          # removed or duplicated mission, or unreadable fleet state, fails.
          export STAGING_MISSION_MANIFEST="$RUNNER_TEMP/staging-mission.json"
          python scripts/staging_mission.py compose --base "$EXPECTED^1" --head "$EXPECTED" --allow-none --output "$STAGING_MISSION_MANIFEST"
          python - <<'PY'
          import json, os, subprocess
          v = json.load(open(os.environ['STAGING_MISSION_MANIFEST']))['deployment_verification']
          expected = os.environ['EXPECTED']
          extra = [arg for check in v.get('checks', []) for arg in ('--check', check)]
          subprocess.run(['python', 'scripts/verify_staging_delivery.py', '--expected', expected,
                          '--api-sha', v['api_sha'],
                          '--revision', v['revision'], '--output', 'docs/agent/evidence/latest-staging-delivery.json', *extra], check=True)
          PY
      - name: Signed-out website smoke (public pages, sign-in redirects, card images)
        if: steps.head.outputs.current == 'true'
        run: python scripts/staging_web_smoke.py --output docs/agent/evidence/latest-web-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-verification-${{ inputs.expected_sha || github.sha }}
          path: |
            docs/agent/evidence/latest-web-smoke.json
            docs/agent/CURRENT_STATE.yaml
            docs/agent/evidence/latest-staging-delivery.json
            docs/agent/evidence/staging-state-*.json
